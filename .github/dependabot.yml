version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    ignore:
      # The types must match the oldest supported Node.js (engines: >=22), or code could use newer APIs.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint does not support TypeScript 7 yet. Tracked in an issue.
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']
