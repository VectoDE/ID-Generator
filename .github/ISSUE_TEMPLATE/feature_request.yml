name: Feature request
description: Suggest a token, format or option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem does this solve?
      description: What kind of ID do you need, and where is it used?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How would you like to call it? A code sample helps.
      render: ts
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you tried
      description: For example a custom token or a transform.
