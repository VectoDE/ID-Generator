name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems belong in a [private advisory](https://github.com/VectoDE/ID-Generator/security/advisories/new), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Code or command to reproduce
      description: The smallest snippet or CLI call that shows the problem.
      render: ts
      placeholder: |
        import { createPatternGenerator } from '@vectode/id-generator';
        const ids = createPatternGenerator({ pattern: 'INV-{year}-{seq:5}' });
        console.log(await ids.generate());
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and OS
      placeholder: Node 24 on Windows 11, Chrome 141, Deno 2, Bun 1.3
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error message or output
      render: text
