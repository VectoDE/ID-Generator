# Every push to main becomes a release: the version is raised (scripts/prepare-release.mjs), the release commit and
# tag go to main, and the package is built once, signed with a build attestation and published as a GitHub release
# (tarball and attestation attached), to npm through Trusted Publishing with provenance, and to GitHub Packages.
# Commits with "[skip release]" in the message are left out, and so is the release commit itself.
#
# The deploy key that may push past the main ruleset is only handed to the "Commit and tag" job, which runs no
# dependency code: it applies the version change prepared and checked in an earlier job without the key.
#
# Run it by hand to pick the version step, with "publish" to publish an existing tag again where it is missing (for
# example after a registry outage), or with "attach" to only add the signed tarball to an existing GitHub release.
# Every step skips what already exists, so a rerun is safe.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version step
        type: choice
        options: [auto, patch, minor, major, publish, attach]
        default: auto
      tag:
        description: Existing tag for publish and attach (default the version in package.json)
        type: string
        required: false

permissions:
  contents: read

# One release at a time; a run that waits behind another sees its release commit and starts from there.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Pick the version and check
    if: github.repository == 'VectoDE/ID-Generator'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # labels that decide the version step
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip when main moved on
        id: current
        run: |
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$main" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at ${main:0:7}, this run is for ${GITHUB_SHA:0:7}; the newer run releases both."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.current.outputs.current == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pick the version
        id: version
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'auto' }}
          TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ runner.temp }}/release/notes.md
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          case "$BUMP" in
            publish | attach)
              tag="${TAG:-v$(node -p "require('./package.json').version")}"
              if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
                ! git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
                echo "::error::$tag is not an existing version tag."
                exit 1
              fi
              git tag --list "$tag" --format='%(contents)' > "$RELEASE_NOTES"
              printf 'release=true\nversion=%s\ntag=%s\n' "${tag#v}" "$tag" | tee -a "$GITHUB_OUTPUT"
              ;;
            *) RELEASE_BUMP="$BUMP" node scripts/prepare-release.mjs ;;
          esac
          git diff --binary > "$RUNNER_TEMP/release/version.patch"
      # Saved before any dependency code runs, so nothing installed below can change what gets committed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.release == 'true'
        with:
          name: release
          path: ${{ runner.temp }}/release/
          retention-days: 7
      - name: Check the release
        if: steps.version.outputs.release == 'true' && inputs.bump != 'publish' && inputs.bump != 'attach'
        run: |
          npm ci --ignore-scripts
          npm run check

  commit:
    name: Commit and tag
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && inputs.bump != 'publish' && inputs.bump != 'attach'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the push uses the deploy key, not this token
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deploy key is the only actor that may push past the main ruleset. Its push starts this workflow again,
          # which finds nothing new to release.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Commit and tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          patch="$RUNNER_TEMP/release/version.patch"
          changed="$(git apply --numstat "$patch" | cut -f3 | sort | tr '\n' ' ')"
          if [ "$changed" != "CHANGELOG.md package-lock.json package.json " ]; then
            echo "::error::The version change touches unexpected files: $changed"
            exit 1
          fi
          git apply "$patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --all --message "Release $TAG" --message "[skip release]"
          git tag --annotate "$TAG" --file "$RUNNER_TEMP/release/notes.md" --cleanup=verbatim
          git push --atomic origin HEAD:main "$TAG"

  package:
    name: Build and sign the package
    needs: [prepare, commit]
    if: always() && needs.prepare.outputs.release == 'true' && contains(fromJSON('["success", "skipped"]'), needs.commit.result)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore signature for the build attestation
      attestations: write # stores the attestation with the repository
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
          tarball="$(cd "$RUNNER_TEMP/package" && ls -- *.tgz)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
      - name: Keep the attestation next to the tarball
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/package/$TARBALL.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
          retention-days: 7

  github:
    name: GitHub release
    needs: [prepare, package]
    if: always() && needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # GitHub release and its assets
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Create the release or add the signed package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          assets=("$RUNNER_TEMP"/package/*)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" -R "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" "${assets[@]}" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release/notes.md" $prerelease

  npm:
    name: Publish to npm
    needs: [prepare, package]
    if: always() && needs.package.result == 'success' && inputs.bump != 'attach'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for Trusted Publishing and provenance; no npm token is stored anywhere.
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      # Node 24 ships npm 11, which Trusted Publishing needs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the signed tarball
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: |
          if [ -n "$(npm view "@vectode/id-generator@$VERSION" version 2> /dev/null)" ]; then
            echo "@vectode/id-generator@$VERSION is already on npm."
            exit 0
          fi
          # Prereleases go to "next", and an older version published again must not take "latest" back.
          latest="$(npm view @vectode/id-generator dist-tags.latest 2> /dev/null || true)"
          dist_tag=latest
          case "$VERSION" in *-*) dist_tag=next ;; esac
          newest="$(printf '%s\n' "$latest" "$VERSION" | sort -V | tail -n1)"
          if [ -n "$latest" ] && [ "$newest" != "$VERSION" ]; then
            dist_tag=previous
          fi
          npm publish "$RUNNER_TEMP/package/$TARBALL" --provenance --access public --tag "$dist_tag"

  github-packages:
    name: Publish to GitHub Packages
    needs: [prepare, package]
    if: always() && needs.package.result == 'success' && inputs.bump != 'attach'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # shows the package on the repository page
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@vectode'
      - name: Publish the signed tarball
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: |
          registry=https://npm.pkg.github.com
          if [ -n "$(npm view "@vectode/id-generator@$VERSION" version --registry "$registry" 2> /dev/null)" ]; then
            echo "@vectode/id-generator@$VERSION is already on GitHub Packages."
            exit 0
          fi
          dist_tag=latest
          case "$VERSION" in *-*) dist_tag=next ;; esac
          # GitHub Packages does not take npm provenance statements.
          npm publish "$RUNNER_TEMP/package/$TARBALL" --registry "$registry" --provenance=false --tag "$dist_tag"
