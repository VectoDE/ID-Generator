# SonarQube / SonarQube Cloud. Set sonar.organization when you connect the project to SonarQube Cloud.
sonar.projectKey=VectoDE_ID-Generator
sonar.projectName=ID Generator
sonar.sourceEncoding=UTF-8

sonar.sources=src,playground/src,scripts,bench
sonar.tests=test
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,playground/dist/**

# Written by `npm run test:coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
